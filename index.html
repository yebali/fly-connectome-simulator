<meta charset="utf-8">
<title>책상 위의 초파리</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="styles.css">

<div id="stage"></div>
<div id="divider"><span class="grip"><i></i><i></i><i></i><i></i></span></div>
<div id="boot">회로 조립 중</div>

<div id="hud">
  <section class="panel" id="masthead">
    <p class="eyebrow">Male CNS Connectome · v1.0</p>
    <h1>책상 위의 초파리</h1>
    <p id="stats"></p>
  </section>
  <div id="flyCards"></div>
  <section class="panel" id="controls">
    <p class="eyebrow">실험</p>
    <div id="toggles"></div>
    <hr>
    <div class="slider">
      <label class="row" for="exposure">밝기 <b id="exposureVal">1.40</b></label>
      <input type="range" id="exposure" min="0.5" max="2.6" step="0.05" value="1.4">
    </div>
    <button class="ctl" id="drawerToggle" type="button" aria-pressed="true">
      <span>뉴런 지도</span><span class="sw">펼침</span>
    </button>
    <hr>
    <p class="eyebrow" style="margin-bottom:6px">대조 실험 — 커넥톰 교란</p>
    <div id="scrambles"></div>
    <hr>
    <p class="note" id="lesionNote">회로를 끄면 파리는 직진만 하다 부딪칩니다.</p>
  </section>
</div>
<div id="flyOverlays"></div>

<div id="provenance">
  <div><span class="real">커넥톰에서</span> <b>배선 · 시냅스 가중치 · 수용장 · 흥분/억제 부호 · 좌우 편측성 · 뉴런 형태</b></div>
  <div><span class="model">모델</span> 뉴런 시간상수 · 광학흐름 계산 · 비행 역학 · 토크 이득 · 착지와 휴식 — 커넥톰에 없는 값</div>
  <div>neuPrint <span id="ds"></span> · HHMI Janelia FlyEM + Google Research</div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.163.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.163.0/examples/jsm/"
  }
}
</script>
<script type="module" src="app.js"></script>
